[package]
name = "omniplay-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true
omniplay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
rusqlite.workspace = true
semver.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
getrandom.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "time"] }

[[bin]]
name = "omniplay-update"
path = "src/main.rs"

[[bin]]
name = "omniplay-launcher"
path = "src/launcher.rs"

[[bin]]
name = "omniplay-sign"
path = "src/sign.rs"
