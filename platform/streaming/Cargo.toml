[package]
name = "omniplay-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
uuid.workspace = true
url.workspace = true
zeroize.workspace = true
getrandom.workspace = true
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking","json","rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["linux-native-sync-persistent","crypto-rust"] }
