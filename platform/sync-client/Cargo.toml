[package]
name = "omniplay-sync-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true
omniplay-core.workspace = true
omniplay-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
sha2.workspace = true
zeroize.workspace = true
rusqlite.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking","json","rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["linux-native-sync-persistent","crypto-rust"] }
