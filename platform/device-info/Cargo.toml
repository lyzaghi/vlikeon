[package]
name = "omniplay-device-info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = {version="=0.61.2",features=["Win32_Foundation","Win32_System_SystemInformation","Win32_System_Power"]}
windows = {version="=0.61.3",features=["Win32_Foundation","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common"]}

[target.'cfg(any(target_os="macos",target_os="ios"))'.dependencies]
libc = "=0.2.191"
