[package]
name = "omniplay-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os="linux")'.dependencies]
libc = "=0.2.191"
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = {version="=0.61.2",features=["Win32_Foundation","Win32_Security","Win32_Security_Isolation","Win32_Security_Authorization","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_Pipes","Win32_System_JobObjects","Win32_System_SystemInformation","Win32_System_SystemServices","Win32_System_Com","Win32_System_Registry","Win32_UI_WindowsAndMessaging","Win32_UI_Shell"]}
