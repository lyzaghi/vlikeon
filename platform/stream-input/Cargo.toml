[package]
name = "omniplay-stream-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Private adapter only; no broker capability or automatic driver/build install.
# Requires the separately admitted, explicitly linked C++ static library.
winuhid = []

[dependencies]
omniplay-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="=0.61.2",features=["Win32_Foundation","Win32_System_Threading","Win32_System_SystemInformation","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_HiDpi","Win32_Graphics_Gdi"]}

[[bin]]
name = "omniplay-input-worker"
path = "src/main.rs"
