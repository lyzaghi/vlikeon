[package]
name = "omniplay-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
omniplay-contracts.workspace = true
omniplay-streaming.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
rusqlite.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
semver.workspace = true
encoding_rs = "=0.8.35"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
omniplay-stream-input.workspace = true

# QA examples pause actual save transactions at TEMP triggers. Product builds
# do not enable SQL callbacks through this development-only dependency.
[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
