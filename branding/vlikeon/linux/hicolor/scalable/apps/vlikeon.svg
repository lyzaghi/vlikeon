<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none" role="img" aria-labelledby="title-neon desc-neon">
  <title id="title-neon">Vlikeon Browser — Open View Transparent Neon Master</title>
  <desc id="desc-neon">Fully transparent cyberpunk neon master for Vlikeon Gaming Superbrowser. Pure 6px gradient outlines framing two open architectural brackets and a central negative-space V, with completely transparent interiors and canvas.</desc>
  <defs>
    <!-- Luminous Cyberpunk Neon Gradient: Electric Cyan -> Hyper Violet -> Hot Magenta -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="52%" stop-color="#885CFF" />
      <stop offset="100%" stop-color="#FF2BD6" />
    </linearGradient>
  </defs>
  <!-- Architectural Outlines Only: fill=none, zero background, 6px neon border, 16px bottom gap, 56px top V-aperture -->
  <g fill="none" stroke="url(#neon-grad)" stroke-width="6" stroke-linejoin="round">
    <!-- Left Architectural Bracket -->
    <path d="M 48,76 L 68,56 L 100,56 L 120,156 L 120,200 L 64,200 L 48,184 Z" />
    <!-- Right Architectural Bracket -->
    <path d="M 208,76 L 188,56 L 156,56 L 136,156 L 136,200 L 192,200 L 208,184 Z" />
  </g>
</svg>
