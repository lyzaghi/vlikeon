[workspace]
resolver = "2"
members = ["platform/contracts", "platform/core", "platform/broker", "platform/sync", "platform/sync-client", "platform/web-sync", "platform/updater", "platform/sandbox", "platform/native-runtime", "platform/local-service", "platform/mobile", "platform/streaming", "platform/stream-input", "platform/device-info", "services/sync", "services/signaling"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
uuid = { version = "=1.25.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
semver = { version = "=1.0.28", features = ["serde"] }
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
getrandom = "=0.2.17"
zeroize = { version = "=1.8.2", features = ["derive"] }
omniplay-contracts = { path = "platform/contracts" }
omniplay-core = { path = "platform/core" }
omniplay-sync = { path = "platform/sync" }
omniplay-sync-client = { path = "platform/sync-client" }
omniplay-updater = { path = "platform/updater" }
omniplay-sandbox = { path = "platform/sandbox" }
omniplay-native-runtime = { path = "platform/native-runtime" }
omniplay-local-service = { path = "platform/local-service" }
omniplay-streaming = { path = "platform/streaming" }
omniplay-stream-input = { path = "platform/stream-input" }
omniplay-device-info = { path = "platform/device-info" }
url = "=2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
