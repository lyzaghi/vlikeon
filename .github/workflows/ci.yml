name: OmniPlay Continuous Integration

on:
  push:
    branches: [main, 'codex/qa-*']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Qualification Suites & Clean Clone Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Clean Clone Integrity
        run: python tools/verify_clean_clone.py

      - name: Run Android Qualification Suite
        run: python qa/mobile/android_qualification.py

      - name: Run iOS Qualification Suite
        run: python qa/mobile/ios_qualification.py

      - name: Verify Reproducible Development Web Assembly
        run: python tools/assemble_web.py --without-cores --check-receipt

      - name: Run Web/PWA Qualification Suite
        run: python qa/web_pwa_qualification.py

      - name: Run Encrypted Sync Qualification Suite
        run: python qa/sync_qualification.py

      - name: Run Benchmark & Presentation Qualification Suite
        run: python qa/benchmark_qualification.py

      - name: Run Installer, Repair & Update Qualification Suite
        run: python qa/installer_qualification.py

      - name: Run Security, Licensing & Release Qualification Suite
        run: python qa/security_license_qualification.py

      - name: Run Chromium Patch Rehearsal Regression
        run: python qa/browser/upgrade_rehearsal_test.py -v

      - name: Run Browser Module Regression
        run: node --experimental-vm-modules --test qa/browser/*.test.mjs

      - name: Install Linux Keyring Build Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run Rust Regression
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          command = [
              "cargo", "test", "--locked",
              "-p", "omniplay-streaming", "-p", "omniplay-updater",
              "-p", "omniplay-sync", "-p", "omniplay-sync-client",
              "-p", "omniplay-sync-service",
          ]
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          text = result.stdout.decode("utf-8", errors="replace")
          print(text)
          Path(os.environ["RUNNER_TEMP"], "vlikeon-rust-regression.log").write_text(text, encoding="utf-8")
          if result.returncode:
              tail = text[-12000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Rust regression failed::" + tail)
          sys.exit(result.returncode)

      - name: Upload Rust Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-regression-${{ matrix.os }}
          path: ${{ runner.temp }}/vlikeon-rust-regression.log

  live-remote-play:
    name: WebRTC Direct and TURN Loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Two Browser Peers Against Local TURN
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          command -v google-chrome
          export VLIKEON_QA_TURN_USER=vlikeon-fixture
          VLIKEON_QA_TURN_PASSWORD="$(openssl rand -hex 24)"
          export VLIKEON_QA_TURN_PASSWORD
          turnserver -c /dev/null --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 \
            --listening-port=5348 --allow-loopback-peers --no-tls --no-dtls --no-cli \
            --min-port=52000 --max-port=52030 --realm=vlikeon.test --lt-cred-mech \
            --user="$VLIKEON_QA_TURN_USER:$VLIKEON_QA_TURN_PASSWORD" >"$RUNNER_TEMP/vlikeon-turn.log" 2>&1 &
          turn_pid=$!
          trap 'kill "$turn_pid" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$turn_pid"
          python3 qa/browser/remote_play_live.py --browser "$(command -v google-chrome)" \
            --turn-url 'turn:127.0.0.1:5348?transport=udp' --output "$RUNNER_TEMP/vlikeon-remote-play.json"

      - name: Upload WebRTC Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-play-loopback
          path: |
            ${{ runner.temp }}/vlikeon-remote-play.json
            ${{ runner.temp }}/vlikeon-remote-play.browser.log
