<!doctype html>
<meta charset="utf-8">
<title>Vlikeon Remote Play qualification</title>
<script type="module">
import { CaptureSource } from "/engines/streaming/capture.js";
import { RemoteSession } from "/engines/streaming/rtc.js";

const configuration = await (await fetch("/configuration")).json();
const assert = (value, message) => { if (!value) throw new Error(message); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
let failure;
const peerConnections = [];
const PeerConnection = globalThis.RTCPeerConnection;
globalThis.RTCPeerConnection = class extends PeerConnection {
  constructor(options) {
    super(options);
    peerConnections.push(this);
  }
};
class FixtureSignal extends EventTarget {
  closed = false;
  messages = [];
  constructor(role, relay) {
    super();
    this.pair = { role, input_allowed: true };
    this.relay = relay;
  }
  async ice() {
    return { relay_available: Boolean(this.relay), ice_servers: this.relay ? [this.relay] : [] };
  }
  async send(session_id, value) {
    this.messages.push(value);
    this.peer.dispatchEvent(new CustomEvent("signal", { detail: { session_id, value } }));
  }
  async close() { this.closed = true; }
}
async function until(description, predicate, timeout = 12000) {
  const end = performance.now() + timeout;
  while (performance.now() < end) {
    if (failure) throw failure;
    if (await predicate()) return;
    await sleep(30);
  }
  throw new Error("Timed out waiting for " + description);
}
async function selectedRoute(pc) {
  const stats = await pc.getStats();
  const transport = [...stats.values()].find(item => item.type === "transport" && item.selectedCandidatePairId);
  const pair = stats.get(transport?.selectedCandidatePairId);
  if (!pair || transport.dtlsState !== "connected") return null;
  return {
    dtls: transport.dtlsState,
    local: stats.get(pair.localCandidateId)?.candidateType,
    remote: stats.get(pair.remoteCandidateId)?.candidateType,
  };
}
async function qualify(relay) {
  failure = undefined;
  peerConnections.length = 0;
  const clientSignal = new FixtureSignal("client", relay);
  const hostSignal = new FixtureSignal("host", relay);
  clientSignal.peer = hostSignal;
  hostSignal.peer = clientSignal;
  const options = { relayOnly: Boolean(relay) };
  const client = new RemoteSession(clientSignal, options);
  const host = new RemoteSession(hostSignal, options);
  for (const session of [client, host]) {
    session.addEventListener("session_error", event => {
      failure = new Error(`${session.role}: ${event.detail.code}: ${event.detail.message}`);
    });
  }

  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 180;
  const context = canvas.getContext("2d");
  let frame = 0;
  const draw = () => {
    context.fillStyle = frame++ % 2 ? "#124" : "#5fa";
    context.fillRect(0, 0, 320, 180);
  };
  draw();
  const timer = setInterval(draw, 33);
  const source = new CaptureSource(canvas.captureStream(30), { profile: "p720_60" });
  const track = source.stream.getVideoTracks()[0];
  host.addEventListener("incoming", () => void host.accept(source).catch(error => { failure = error; }), { once: true });

  const video = document.createElement("video");
  video.muted = true;
  video.autoplay = true;
  document.body.append(video);
  client.addEventListener("media", event => { video.srcObject = event.detail.stream; });
  let decodedFrames = 0;
  const nextFrame = () => { decodedFrames++; video.requestVideoFrameCallback(nextFrame); };
  video.requestVideoFrameCallback(nextFrame);
  let inputCount = 0;
  let inputAvailable = false;
  host.addEventListener("input", () => { inputCount++; });
  client.addEventListener("input_available", event => { inputAvailable = event.detail.available; });
  const input = { schema_version: 1, keys: [], mouse: { dx: 1, dy: 0, wheel: 0, buttons: 0 }, pads: [] };

  try {
    await client.connect();
    await until("connected peers and decoded video", () => (
      peerConnections.length === 2 && peerConnections.every(pc => pc.connectionState === "connected") && decodedFrames > 0
    ));
    const route = await selectedRoute(peerConnections[0]);
    assert(route && route.local === (relay ? "relay" : "host"), "Unexpected WebRTC candidate route " + JSON.stringify(route));

    host.armInput(true);
    await until("remote input grant", () => inputAvailable);
    assert(client.sendInput(input), "Client refused valid input");
    await until("input delivery", () => inputCount === 1);
    host.armInput(false);
    await until("remote input revocation", () => !inputAvailable);
    assert(!client.sendInput(input), "Client sent input after revocation");

    const initialOffer = clientSignal.messages.find(message => message.type === "offer");
    const initialFrames = decodedFrames;
    await hostSignal.send(client.id, { type: "restart" });
    await until("answer to ICE restart", () => hostSignal.messages.some(message => message.type === "answer" && message.generation > initialOffer.generation));
    await until("video and connection after ICE restart", () => decodedFrames > initialFrames + 4 && peerConnections.every(pc => pc.connectionState === "connected" && pc.signalingState === "stable"));
    const restartOffer = clientSignal.messages.find(message => message.type === "offer" && message.generation > initialOffer.generation);
    const ufrag = message => /^a=ice-ufrag:(.*)$/m.exec(message.description.sdp)?.[1];
    assert(restartOffer && ufrag(restartOffer) && ufrag(restartOffer) !== ufrag(initialOffer), "ICE restart did not rotate ICE credentials");

    track.stop();
    track.dispatchEvent(new Event("ended")); // Simulates the browser reporting loss of its capture source.
    await until("capture failure closes both sessions", () => !client.active && !host.active);
    return { route, decodedFrames, restartGeneration: restartOffer.generation, inputRevoked: true, captureEndClosedPeers: true };
  } finally {
    clearInterval(timer);
    await Promise.allSettled([client.stop(), host.stop()]);
    video.remove();
  }
}

try {
  const direct = await qualify(null);
  const relay = configuration.turn ? await qualify(configuration.turn) : null;
  await fetch("/result", { method: "POST", body: JSON.stringify({ passed: true, direct, relay }) });
} catch (error) {
  await fetch("/result", { method: "POST", body: JSON.stringify({ passed: false, error: error.message, stack: error.stack }) });
}
</script>
